<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portale Affiliati – Agenzie di Viaggio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ec;--card:#fff;--ink:#14263b;--muted:#667385;--line:#e3dfd4;--soft:#f8f7f3;
  --primary:#1b75b0;--primary-2:#145d8e;--primary-soft:#e2f0f9;
  --accent:#f07c1b;--accent-soft:#fdecda;
  --ok:#2f7d4f;--ok-soft:#e2f1e7;--warn:#a8700c;--warn-soft:#fbf0d8;--bad:#b23f2e;--bad-soft:#f8e1dc;--info:#2d5a9a;--info-soft:#e2eaf6;
  --r:14px;--shadow:0 1px 2px rgba(20,38,59,.05),0 4px 16px rgba(20,38,59,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
h4{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0 0 8px}
a{color:var(--primary)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.demo{background:var(--ink);color:#d9e1ea;font-size:12.5px;padding:7px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo b{color:#fff}
.demo button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px 11px;font:inherit;cursor:pointer}
.demo button:hover{background:rgba(255,255,255,.2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 15px;font:600 14px "Plus Jakarta Sans",sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#c9c3b3}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad);border-color:#ecc6be}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],textarea,select{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
input[readonly]{background:var(--soft)}
textarea{min-height:90px;resize:vertical}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font:700 13px "Plus Jakarta Sans";margin-right:8px;vertical-align:2px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.info{background:var(--info-soft);color:var(--info)}.badge.neutral{background:#eeece6;color:#5c6470}.badge.accent{background:var(--accent-soft);color:#b5560a}
.note{border-radius:10px;padding:11px 14px;font-size:13.5px;margin:0 0 14px}
.note.warn{background:var(--warn-soft);color:#6f4a06}.note.bad{background:var(--bad-soft);color:#7d2a1e}.note.ok{background:var(--ok-soft);color:#1f5536}.note.info{background:var(--info-soft);color:#1f3f6e}
.kv{display:grid;grid-template-columns:170px 1fr;gap:7px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;word-break:break-word}
@media(max-width:560px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;background:var(--soft)}

/* AUTH */
.auth{min-height:calc(100vh - 34px);display:grid;grid-template-columns:1.1fr 1fr}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth-art{display:none}}
.auth-art{background:linear-gradient(160deg,#2386c4 0%,#16608f 55%,#0f3a5a 100%);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art h1{font-size:40px;line-height:1.1;max-width:440px}
.auth-art p{color:#cfe5f4;max-width:420px;font-size:15.5px}
.auth-art .steps{display:grid;gap:12px;margin-top:28px}
.auth-art .steps div{display:flex;gap:12px;align-items:center;color:#e2eeee}
.auth-art .steps span{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:700;font-size:13px}
.auth-art svg.sun{position:absolute;right:-80px;top:-80px;opacity:.16}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px}
.auth-box{width:100%;max-width:400px}
.tabs{display:flex;gap:4px;background:#e9e6dd;padding:4px;border-radius:12px;margin:22px 0}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font:600 14px "Plus Jakarta Sans";cursor:pointer;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:140px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:600;background:#fff}
.seg label:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.err{color:var(--bad);font-size:13px;min-height:18px}

/* SHELL */
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.brand{display:flex;gap:10px;align-items:center;font-family:Fraunces,serif;font-weight:600;font-size:17px}
.brand i{width:32px;height:32px;border-radius:9px;background:var(--primary);display:grid;place-items:center}
.wrap{max-width:980px;margin:0 auto;padding:26px 20px 60px}
.subtabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:none;padding:10px 14px;font:600 14px "Plus Jakarta Sans";color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.subtabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.count{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.count.grey{background:#d9d5ca;color:var(--ink)}

.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:18px 0 22px}
.stepper div{position:relative;padding-top:12px;font-size:12px;font-weight:600;color:var(--muted)}
.stepper div::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:5px;background:#e3dfd4}
.stepper div.done::before{background:var(--primary)}
.stepper div.cur::before{background:linear-gradient(90deg,var(--accent) 50%,#e3dfd4 50%)}
.stepper div.cur{color:var(--ink)}.stepper div.done{color:var(--primary)}
@media(max-width:640px){.stepper{grid-template-columns:repeat(3,1fr)}}
.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}

.persona{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}
.urlrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.urlrow .i{font-weight:700;color:var(--muted)}
.urlrow.def{border-color:var(--primary);background:var(--primary-soft)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px}

.logos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.logos{grid-template-columns:1fr}}
.logo-tile{border:2px solid var(--line);border-radius:12px;background:#fff;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center;font:inherit;position:relative}
.logo-tile:hover{border-color:#bfb8a6}
.logo-tile.sel{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.logo-tile .img{height:110px;display:grid;place-items:center;background:var(--soft);border-radius:8px;overflow:hidden}
.logo-tile img{max-width:100%;max-height:100px}
.logo-tile .tag{position:absolute;top:8px;right:8px}
.logo-slot{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.logo-slot .img{height:110px;display:grid;place-items:center;background:#fff;border-radius:8px;overflow:hidden}
.logo-slot img{max-width:100%;max-height:100px}
.logo-slot.chosen{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}

.browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:16px;background:#fff}
.browser .bar{background:#eeece6;padding:8px 12px;display:flex;gap:10px;align-items:center}
.browser .dots{display:flex;gap:5px}.browser .dots i{width:10px;height:10px;border-radius:50%;background:#d3cfc4}
.browser .addr{flex:1;background:#fff;border-radius:7px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.browser .addr b{color:var(--ink);font-weight:600}
.browser .site{padding:18px 22px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
.browser .site img{height:54px;max-width:220px}
.browser .site .nm{font-family:Fraunces,serif;font-size:20px}
.browser .heroimg{height:120px;background:linear-gradient(120deg,#cfe6f6,#fde0c4);display:grid;place-items:center;color:#557;font-size:13px}

.upload{display:flex;align-items:center;gap:14px;border:1.5px dashed #c9c3b3;border-radius:12px;padding:16px;background:var(--soft);cursor:pointer}
.upload:hover{border-color:var(--primary)}
.upload input{display:none}
.file{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.file .ic{width:38px;height:38px;border-radius:8px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary);font-weight:700;font-size:11px}
.pre{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px}

.progress{height:10px;background:#ebe8df;border-radius:10px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#4aa3dc);border-radius:10px}
.fasi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.fasi div{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-weight:600;color:var(--muted);background:#fff}
.fasi div small{display:block;font-weight:500}
.fasi div.done{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.fasi div.cur{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
@media(max-width:640px){.fasi{grid-template-columns:1fr 1fr}}
.sch-grid .fasi{grid-template-columns:1fr 1fr}
.big{font-family:Fraunces,serif;font-size:34px;line-height:1}

.cred{display:grid;grid-template-columns:150px 1fr auto;gap:8px 10px;align-items:center}
@media(max-width:560px){.cred{grid-template-columns:1fr}}
.cred .v{display:flex;gap:6px}
.cred .v input{font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
.off{text-decoration:line-through;color:var(--muted)}

/* ADMIN */
.admin{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 34px - 57px)}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px}
.side button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:10px 12px;border-radius:10px;font:600 14px "Plus Jakarta Sans";color:#3d4a5a;cursor:pointer;text-align:left}
.side button:hover{background:var(--soft)}
.side button.on{background:var(--primary-soft);color:var(--primary)}
.side .sep{height:1px;background:var(--line);margin:10px 6px}
.amain{padding:26px 28px 60px;max-width:1100px;width:100%}
@media(max-width:860px){.admin{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--line);padding:8px}.side button{width:auto;white-space:nowrap;gap:8px}.side .sep{display:none}.amain{padding:20px 16px}}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0 22px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.kpis .kpi:last-child{grid-column:1/-1}}
@media(max-width:380px){.kpis{grid-template-columns:1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi:hover{border-color:#c9c3b3}
.kpi b{display:block;font-family:Fraunces,serif;font-size:30px;font-weight:600}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi.hot b{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid #efece5;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.tablewrap{overflow-x:auto}
.todo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #efece5}
.todo:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
.reminders{display:flex;gap:6px;flex-wrap:wrap}
.rem{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:#eeece6;color:#6b7280}
.rem.sent{background:var(--warn-soft);color:var(--warn)}
.rem.now{background:var(--accent);color:#fff}
.rem.cancel{background:var(--ok-soft);color:var(--ok);text-decoration:line-through}
.back{border:0;background:none;color:var(--muted);font:600 13.5px "Plus Jakarta Sans";cursor:pointer;padding:0;margin-bottom:12px}
.sch-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:18px}
.sch-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sch-grid .card+.card{margin-top:0}
.sch-grid .full{grid-column:1/-1}
@media(max-width:900px){.sch-grid{grid-template-columns:1fr}}

/* TICKET */
.tk{display:grid;grid-template-columns:320px 1fr;gap:16px}
@media(max-width:820px){.tk{grid-template-columns:1fr}}
.tk-list{display:flex;flex-direction:column;gap:8px}
.tk-item{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.tk-item.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.tk-item.unread{border-left:4px solid var(--accent)}
.tk-item .t{font-weight:600}
.msgs{display:flex;flex-direction:column;gap:10px;margin:14px 0;max-height:420px;overflow:auto;padding-right:4px}
.msg{max-width:82%;padding:10px 13px;border-radius:12px;font-size:14px;white-space:pre-wrap}
.msg small{display:block;font-size:11.5px;opacity:.7;margin-top:4px}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:#efece5;border-bottom-left-radius:4px}

@media(max-width:640px){
  .top{padding:10px 14px}.top .small{display:none}.brand{font-size:15px}.brand span{display:none}
  .wrap{padding:18px 14px 50px}.card{padding:16px}h1{font-size:23px}h2{font-size:20px}.auth-form{padding:22px 16px}
  .persona{grid-template-columns:1fr 1fr;}.persona button{grid-column:1/-1;justify-self:end}
  .urlrow{grid-template-columns:24px 1fr}.urlrow>:last-child{grid-column:1/-1}
  .urlrow input{width:100%!important}
  .subtabs{overflow-x:auto}.subtabs button{white-space:nowrap}
  .kv{font-size:13.5px}.big{font-size:27px}
  .card-h{flex-wrap:wrap}
  .modal{padding:18px}.modal .act{flex-wrap:wrap}.modal .act .btn{flex:1;justify-content:center}
  .demo{font-size:11.5px;padding:6px 10px}.demo span{display:none}
  .tk-item .row{flex-wrap:wrap}.msg{max-width:92%}
  .sch-h .row{width:100%}
  .row.end-m{justify-content:stretch}.row.end-m .btn{flex:1;justify-content:center}
  table.resp thead{display:none}table.resp tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.resp td{display:block;border:0;padding:4px 6px;text-align:left!important}
  table.resp td[data-l]::before{content:attr(data-l);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  .pwrow{grid-template-columns:1fr!important}
}
.pay{display:grid;grid-template-columns:150px 1fr auto;gap:8px 12px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pay .k{color:var(--muted);font-size:13px}.pay .v{font-weight:600;overflow-wrap:anywhere}
.pay .tot{font-family:Fraunces,serif;font-size:22px;color:var(--primary)}
@media(max-width:560px){.pay{grid-template-columns:1fr auto}.pay .k{grid-column:1/-1;margin-top:6px}}
.pwrow{display:grid;grid-template-columns:1.3fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #efece5}
.pwrow:last-child{border-bottom:0}
.pwrow .ctl{display:flex;gap:6px}
.pwrow>.btn{justify-content:center}
.pwrow .ctl input{font-family:ui-monospace,Menlo,monospace}
/* NOTIFICHE */
.top .right{display:flex;gap:10px;align-items:center}
.bellwrap{position:relative}
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.bell .count{position:absolute;top:-7px;right:-8px}
.npanel{position:absolute;right:0;top:44px;width:360px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(20,38,59,.18);z-index:30;max-height:70vh;overflow:auto}
.nph{padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.nitem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #f0ede6;background:#fff;padding:11px 14px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.nitem small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.nitem.new{background:var(--primary-soft)}
.nitem:hover{background:var(--soft)}
@media(max-width:640px){.npanel{right:-56px;width:calc(100vw - 24px)}}
.tknum{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--primary);font-weight:700;margin-right:6px}
details.mail{border-bottom:1px solid #efece5;padding:10px 0}
details.mail:last-child{border-bottom:0}
details.mail summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:260px 1fr auto;gap:10px;align-items:center}
details.mail summary::-webkit-details-marker{display:none}
.msub{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbody{padding:10px 0 4px}
.mto{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:760px){details.mail summary{grid-template-columns:1fr}.msub{white-space:normal}}

<script>
(function(){
"use strict";
const KEY='portale-affiliati-v4';
const STEPS=['Dati','Approvazione','URL e logo','Pagamento','Realizzazione','Consegna'];
const FASI=['Pagamento ricevuto','Sviluppo in corso','Revisione e test','Consegnato'];
const REM=[30,15,7,1];
const REM_LBL={30:'1 mese prima',15:'15 giorni prima',7:'7 giorni prima',1:'Giorno prima'};
let S=null;
let ui={authTab:'login',view:'dashboard',sel:null,tab:'percorso',tk:null,q:'',tkFilter:'aperti',err:''};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function iso(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
const today=()=>iso(new Date());
function addDays(d,n){const x=new Date(typeof d==='string'?d+'T00:00':d);x.setDate(x.getDate()+n);return x;}
function addYears(d,n){const x=new Date(d+'T00:00');x.setFullYear(x.getFullYear()+n);return iso(x);}
function addBiz(d,n){const x=new Date(typeof d==='string'?d+'T00:00':d);let k=0;while(k<n){x.setDate(x.getDate()+1);const w=x.getDay();if(w!==0&&w!==6)k++;}return iso(x);}
function daysTo(isoD){const t=new Date(today()+'T00:00');const d=new Date(isoD+'T00:00');return Math.round((d-t)/86400000);}
function fd(x){if(!x)return '—';const d=typeof x==='string'&&x.length===10?new Date(x+'T00:00'):new Date(x);return d.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});}

function causale(a){return (S.settings.pag.causale||'').replace(/\{agenzia\}/g,a.nomeAgenzia||'').replace(/\{url\}/g,urlDef(a)||'');}
function payBox(a,o){const P=S.settings.pag;o=o||{};
  if(!P.iban||!P.intestatario)return `<div class="note warn">I dati per il pagamento non sono ancora disponibili: ti avviseremo a breve.</div>`;
  const imp=parseFloat(String(o.importo!=null?o.importo:P.importo).replace(',','.'));const iva=parseFloat(String(P.iva).replace(',','.'))||0;
  const rows=[['Intestatario',P.intestatario,'p_int'],['IBAN',P.iban,'p_iban'],P.banca?['Banca',P.banca]:null,P.bic?['BIC / SWIFT',P.bic,'p_bic']:null,['Causale',o.causale||causale(a),'p_cau']].filter(Boolean);
  let h='<div class="pay">';
  if(!isNaN(imp))h+=`<div class="k">Importo</div><div><span class="tot">${eur(imp+imp*iva/100)}</span><div class="small muted">${eur(imp)} + IVA ${iva}%</div></div><div></div>`;

  h+='</div>';if(P.note)h+=`<p class="small muted" style="margin-top:8px;white-space:pre-wrap">${esc(P.note)}</p>`;return h;}

  if(ev==='rispCli'){sendMail(adminEmail(),`[Ticket ${n}] Nuova risposta da ${ag}${extra?' – '+extra:''}`,`${ag} ha risposto al ticket ${n} "${t.oggetto}":\n\n${last.testo}${link}`,t.id);notify('admin',`<b>${esc(ag)}</b> ha risposto al ticket <b>${n}</b>${extra?' ('+esc(extra)+')':''}`,t.id);}

  return `<div class="row between" style="margin-bottom:16px"><h2>${ico('globe',22)} Corsi</h2><button class="btn primary" data-a="nuovoCorso">+ Nuovo corso</button></div>
  ${req.length?`<div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:6px">Acquisti corsi Premium da verificare</h3>${req.map(({a,c,q})=>`<div class="todo"><div><b>${esc(a.nomeAgenzia||nomeAff(a))}</b> · ${esc(c.titolo)} <span class="muted small">(${eur(c.prezzo)} + IVA)</span><div class="small muted">Ricevuta caricata ${fdt(q.at)}</div></div>
    <div class="row">${q.ricevuta?`<button class="btn sm" data-a="vediRicC" data-aff="${a.id}" data-id="${c.id}">Ricevuta</button>`:''}<button class="btn sm danger" data-a="rifCorso" data-aff="${a.id}" data-id="${c.id}">Rifiuta</button><button class="btn sm primary" data-a="accCorso" data-aff="${a.id}" data-id="${c.id}">Conferma e sblocca</button></div></div>`).join('')}</div>`:''}
  <div class="cgrid">${S.corsi.map(c=>{const st=A.filter(a=>progC(a,c).started).length,fin=A.filter(a=>progC(a,c).pct===100).length,buy=A.filter(a=>acq(a,c)&&acq(a,c).stato==='attivo').length;

function collectCorso(form){const d=ui.draft;if(!form)return;const f=new FormData(form);const g=k=>String(f.get(k)==null?'':f.get(k)).trim();
  d.titolo=g('titolo');d.categoria=g('categoria')||d.categoria;d.livello=g('livello')||d.livello;d.descr=g('descr');d.premium=f.get('tipo')==='premium';
  if(form.querySelector('[name=prezzo]'))d.prezzo=g('prezzo');d.pubblicato=!!f.get('pubblicato');
  d.lezioni.forEach((l,i)=>{if(form.querySelector(`[name=lt_${i}]`)){l.titolo=g('lt_'+i);l.durata=g('ld_'+i);l.descr=g('lds_'+i);l.url=g('lu_'+i);}});}
function afterRender(){
  document.querySelectorAll('video[data-vk]').forEach(async v=>{try{const b=await IDB.get('v_'+v.dataset.vk);if(b){v.src=URL.createObjectURL(b);}else{v.outerHTML='<div class="pl-in" style="position:static;padding:40px;color:#fff">Il video non è disponibile in questo browser.</div>';}}catch(e){}
    v.addEventListener('ended',()=>{const a=curAff();if(a)markLez(a,v.dataset.cid,v.dataset.vk,true);});});
}
function markLez(a,cid,lid,auto){const c=S.corsi.find(x=>x.id===cid);if(!c)return;a.corsi=a.corsi||{};const p=a.corsi[cid]=a.corsi[cid]||{fatte:[],inizio:Date.now(),completato:null};
  if(p.fatte.includes(lid))return;p.fatte.push(lid);const pr=progC(a,c);
  if(pr.pct===100&&!p.completato){p.completato=Date.now();notifyX(a.id,`Hai completato il corso <b>${esc(c.titolo)}</b>. Complimenti!`,{corsoId:c.id});notifyX('admin',`<b>${esc(a.nomeAgenzia||nomeAff(a))}</b> ha completato il corso <b>${esc(c.titolo)}</b>`,{corsoId:c.id});commit('Corso completato!');return;}
  const nx=c.lezioni.find(l=>!p.fatte.includes(l.id));if(auto&&nx)ui.lez=nx.id;commit(auto?'Video completato':'Segnato come completato');}
function notifyX(to,testo,extra){S.notifs.unshift(Object.assign({id:uid(),to,testo,at:Date.now(),letto:false},extra||{}));}

async function download(name,data){
  if(!DL){if(typeof data==='string'){modal({title:'Copia i dati',body:`<p class="small muted">Il download non è disponibile in questa vista: copia il contenuto qui sotto e incollalo in un file.</p><textarea id="dlTxt" style="min-height:240px;font-family:ui-monospace,monospace;font-size:12px">${esc(data)}</textarea><button class="btn sm" style="margin-top:8px" data-a="copy" data-id="dlTxt">Copia tutto</button>`,cancel:'Chiudi'});}else toast('Download non disponibile in questa vista','warn');return;}
  try{await DL.save({filename:name,data});}catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='rejected_extension'||c==='extension_not_enabled')toast('Questo formato non si può scaricare qui','warn');else if(c==='rate_limited')toast('Attendi un momento e riprova','warn');else toast('Download non disponibile','warn');}
}
const code6=()=>String(Math.floor(100000+Math.random()*900000));
const fsize=b=>b>1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
const extOf=n=>(String(n).split('.').pop()||'').toLowerCase();

function csv(rows){return '﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(';')).join('\r\n');}
async function showBlob(key,name,type){
  let b;try{b=await IDB.get(key);}catch(e){}
  if(!b){toast('File non disponibile in questo browser','warn');return;}
  const u=URL.createObjectURL(b);const t=type||b.type||'';let body;
  if(/^image\//.test(t))body=`<img src="${u}" style="max-width:100%;border-radius:8px;border:1px solid var(--line)">`;
  else if(t==='application/pdf')body=`<iframe src="${u}" style="width:100%;height:65vh;border:1px solid var(--line);border-radius:8px"></iframe>`;
  else if(/^video\//.test(t))body=`<video src="${u}" controls style="width:100%;border-radius:8px"></video>`;
  else body=`<div class="empty">${ico('inbox',26)}<p style="margin-top:6px">Anteprima non disponibile per questo tipo di file.</p></div>`;
  window.__dlBlob={b,name};
  modal({title:esc(name),body:body+`<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary sm" data-a="dlBlob">Scarica</button></div>`,wide:true,cancel:'Chiudi'});
}

  if(a.online)return badge('Sito online','ok');
  if(a.consegnato)return a.richiestaOnline?badge('Chiede messa online','accent'):badge('Consegnato – in modifica','info');
  if(a.pagamento==='confermato')return badge('In realizzazione','info');
  if(a.pagamento==='in_verifica')return badge('Ricevuta da verificare','accent');
  if(a.urlDefinitivo!=null)return badge('Attesa pagamento','neutral');
  return badge('Approvata','ok');
}
function domAlert(a){
  if(!a.dominio||!a.dominio.scadenza)return null;const d=daysTo(a.dominio.scadenza);if(d>30)return null;
  const lv=d<0?'Scaduto':d<=1?REM_LBL[1]:d<=7?REM_LBL[7]:d<=15?REM_LBL[15]:REM_LBL[30];
  return{d,lv,k:d<=7?'bad':'warn'};
}
function remChips(a){
  if(!a.dominio||!a.dominio.scadenza)return '<span class="muted small">Nessuna scadenza impostata</span>';
  const d=daysTo(a.dominio.scadenza);
  let cur=null;for(const t of REM){if(d<=t)cur=t;}
  return '<div class="reminders">'+REM.map(t=>{const data=iso(addDays(a.dominio.scadenza,-t));let c='';if(d<=t)c=t===cur?'now':'sent';
    return `<span class="rem ${c}" title="${fd(data)}">${REM_LBL[t]} · ${fd(data).replace(/ \d{4}$/,'')}</span>`;}).join('')+'</div>';
}
function counts(){
  const A=affs();
  return{req:A.filter(a=>a.stato==='in_attesa').length,ric:A.filter(a=>a.pagamento==='in_verifica').length,
    tk:S.tickets.filter(t=>!t.lettoAdmin&&t.stato!=='chiuso').length,tkOpen:S.tickets.filter(t=>t.stato!=='chiuso').length,
    dom:A.filter(a=>domAlert(a)).length,onl:A.filter(a=>a.richiestaOnline&&!a.online).length,
    real:A.filter(a=>a.pagamento==='confermato'&&!a.consegnato).length,
    url:A.filter(a=>a.stato==='accettata'&&a.urlDefinitivo==null&&a.urls.some(u=>u.value&&u.stato==='da_verificare')).length,
    corsi:A.reduce((n,a)=>n+Object.values(a.acquisti||{}).filter(q=>q.stato==='in_verifica').length,0),
    loghi:A.filter(a=>a.stato==='accettata'&&a.loghi.filter(Boolean).length<3&&!a.consegnato).length};
}

function renderTickets(list,role){
  const isA=role==='admin';

  if(isA&&ui.tkFilter==='aperti')L=L.filter(t=>t.stato!=='chiuso');
  if(isA&&ui.tkFilter==='chiusi')L=L.filter(t=>t.stato==='chiuso');
  const sel=S.tickets.find(t=>t.id===ui.tk)||null;
  const items=L.map(t=>{const unread=isA?!t.lettoAdmin:!t.lettoAff;const a=S.affiliates[t.affId];
    return `<button class="tk-item ${sel&&sel.id===t.id?'on':''} ${unread?'unread':''}" data-a="openTk" data-id="${t.id}"><div class="row between"><span class="t"><span class="tknum">${tkNum(t)}</span>${esc(t.oggetto)}</span>${tkStato(t.stato)}</div>
    <div class="small muted">${isA?esc(a?(a.nomeAgenzia||nomeAff(a)):'')+' · ':''}${fdt(lastAt(t))} · priorità ${esc(t.priorita)}</div></button>`;}).join('')||`<div class="empty small">Nessun ticket${isA&&ui.tkFilter!=='tutti'?' in questo filtro':''}.</div>`;
  let right;
  if(sel){const a=S.affiliates[sel.affId];
    right=`<div class="card"><div class="card-h"><div><div class="tknum" style="font-size:13px">Ticket ${tkNum(sel)}</div><h3>${esc(sel.oggetto)}</h3><div class="small muted">${isA?`<a href="#" data-a="apri" data-id="${a.id}">${esc(a.nomeAgenzia||nomeAff(a))}</a> · `:''}Aperto il ${fdt(sel.createdAt)} · priorità ${esc(sel.priorita)}</div></div>
      ${isA?`<select data-c="tkStato" data-id="${sel.id}" style="width:auto">${['aperto','in_lavorazione','chiuso'].map(s=>`<option value="${s}" ${sel.stato===s?'selected':''}>${tkLbl(s)}</option>`).join('')}</select>`:tkStato(sel.stato)}</div>
      <div class="msgs">${sel.messaggi.map(m=>`<div class="msg ${(m.da==='admin')===isA?'me':'other'}">${esc(m.testo)}<small>${m.da==='admin'?'Supporto':'Affiliato'} · ${fdt(m.at)}</small></div>`).join('')}</div>
      <form data-f="reply" data-id="${sel.id}"><textarea name="testo" placeholder="${sel.stato==='chiuso'?'Scrivi per riaprire il ticket…':'Scrivi una risposta…'}" required></textarea>
      <div class="row" style="justify-content:flex-end;margin-top:8px">${!isA&&sel.stato!=='chiuso'?`<button type="button" class="btn sm ghost" data-a="chiudiTk" data-id="${sel.id}">Segna come risolto</button>`:''}<button class="btn primary sm">Invia</button></div></form>
      ${(()=>{const M=S.emails.filter(e=>e.tkId===sel.id&&(isA||e.to===a.email));return M.length?`<details class="tkmails"><summary>Email inviate per questo ticket (${M.length})</summary>${M.map(e=>`<div class="small" style="margin-top:6px">✉ <b>${esc(e.subject)}</b><br><span class="muted">a ${esc(e.to)} · ${fdt(e.at)}</span></div>`).join('')}</details>`:'';})()}</div>`;}
  else if(!isA)right=`<form class="card" data-f="newTk"><h3 style="margin-bottom:12px">Apri un nuovo ticket</h3>
      <div class="field"><label>Oggetto</label><input type="text" name="oggetto" required placeholder="es. Non riesco a modificare la pagina Offerte"></div>
      <div class="field" style="margin-top:10px"><label>Priorità</label><select name="priorita"><option value="bassa">Bassa</option><option value="media" selected>Media</option><option value="alta">Alta – sito non funzionante</option></select></div>
      <div class="field" style="margin-top:10px"><label>Descrivi il problema</label><textarea name="testo" required></textarea></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary">Invia ticket</button></div></form>`;
  else right=`<div class="empty">Seleziona un ticket per leggerlo e rispondere.</div>`;
  return `<div class="tk"><div><div class="row between" style="margin-bottom:10px">${!isA?`<button class="btn sm primary" data-a="newTkView">+ Nuovo ticket</button>`:
    `<div class="seg" style="gap:4px">${['aperti','chiusi','tutti'].map(f=>`<button class="btn sm ${ui.tkFilter===f?'primary':''}" data-a="tkFilter" data-f="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div>`}</div>
    <div class="tk-list">${items}</div></div><div>${right}</div></div>`;
}
const lastAt=t=>t.messaggi.length?t.messaggi[t.messaggi.length-1].at:t.createdAt;

  if(can('corsi'))A.forEach(a=>Object.entries(a.acquisti||{}).forEach(([cid,q])=>{const c=S.corsi.find(x=>x.id===cid);if(c&&q.stato==='in_verifica')todo.push(['accent',`Acquisto corso Premium <b>${esc(c.titolo)}</b> da <b>${esc(a.nomeAgenzia||nomeAff(a))}</b>`,'Verifica','co:']);}));

  AA.filter(a=>a.pagamento==='in_verifica').forEach(a=>todo.push(['accent',`Ricevuta di pagamento da verificare – <b>${esc(a.nomeAgenzia)}</b>`,'Verifica',a.id]));
  AA.filter(a=>a.richiestaOnline&&!a.online).forEach(a=>todo.push(['accent',`<b>${esc(a.nomeAgenzia)}</b> chiede la messa online del sito`,'Apri',a.id]));
  AA.filter(a=>a.stato==='accettata'&&a.urlDefinitivo==null&&a.urls.some(u=>u.value&&u.stato==='da_verificare')).forEach(a=>todo.push(['info',`Verifica disponibilità URL – <b>${esc(a.nomeAgenzia)}</b>`,'Verifica',a.id]));
  AA.filter(a=>a.stato==='accettata'&&a.loghi.filter(Boolean).length<3&&!a.consegnato).forEach(a=>todo.push(['info',`Carica le 3 proposte di logo – <b>${esc(a.nomeAgenzia)}</b>`,'Carica',a.id]));
  AA.filter(a=>a.pagamento==='confermato'&&!a.consegnato&&a.consegna&&daysTo(a.consegna.dataPrevista)<=3).forEach(a=>todo.push(['bad',`Consegna di <b>${esc(a.nomeAgenzia)}</b> prevista il ${fd(a.consegna.dataPrevista)}`,'Apri',a.id]));
  const col={warn:'var(--warn)',accent:'var(--accent)',info:'var(--info)',bad:'var(--bad)'};
  const al=(can('scadenze')?A:[]).map(a=>({a,x:domAlert(a)})).filter(o=>o.x).sort((p,q)=>p.x.d-q.x.d);
  const tot=todo.length;const h=new Date().getHours();const sal=h<13?'Buongiorno':h<18?'Buon pomeriggio':'Buonasera';
  return `<div class="dash-hero">${sceneW('d')}<div><p>${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</p><h2>${sal}!</h2><p class="sub">${tot?`Hai <b>${tot}</b> attività da gestire oggi.`:'Tutto in ordine: buon viaggio!'}</p></div></div>
  <div class="kpis">${[['richieste','Richieste in attesa',c.req],['affiliati','Ricevute da verificare',c.ric],['affiliati','Siti in realizzazione',c.real,true],['ticket','Ticket aperti',c.tkOpen],['scadenze','Alert domini',c.dom]].filter(k=>can(k[0])).map(([v,l,n,cold])=>`<button class="kpi ${n&&!cold?'hot':''}" data-a="nav" data-v="${v}"><span class="ki">${ico({richieste:'inbox',affiliati:l.startsWith('Ric')?'card':'clock',ticket:'ticket',scadenze:'calendar'}[v])}</span><b>${n}</b><span>${l}</span></button>`).join('')}</div>
  ${al.length?`<div class="card"><div class="card-h"><h3>Domini in scadenza</h3><button class="btn sm" data-a="nav" data-v="scadenze">Vedi tutte</button></div>
    ${al.map(({a,x})=>`<div class="todo"><div><span class="mono"><b>${esc(urlDef(a))}</b></span> · ${esc(a.nomeAgenzia)}<div class="small muted">Scade il ${fd(a.dominio.scadenza)} · ${x.d<0?'scaduto da '+(-x.d)+' giorni':x.d===0?'scade oggi':'tra '+x.d+' giorni'}</div></div>
    <div class="row">${badge('Alert: '+x.lv,x.k)}<button class="btn sm primary" data-a="rinnovo" data-id="${a.id}">Rinnovo pagato</button></div></div>`).join('')}</div>`:''}
  <div class="card"><h3 style="margin-bottom:6px">Da fare</h3>${todo.length?todo.map(([k,t,b,id])=>`<div class="todo"><div><span class="dot" style="background:${col[k]}"></span>${t}</div><button class="btn sm" data-a="${id.startsWith('tk:')?'goTk':id==='co:'?'nav':'apri'}" data-v="corsi" data-id="${id.replace(/^tk:/,'')}">${b}</button></div>`).join(''):'<p class="muted">Tutto in ordine, niente da fare.</p>'}</div>`;

function adAffiliati(){

  <div class="card" style="padding:8px 12px"><div class="tablewrap"><table class="resp"><thead><tr><th>Affiliato</th><th>Agenzia</th><th>URL</th><th>Stato</th><th>Scadenza dominio</th></tr></thead><tbody>
  ${A.map(a=>{const x=domAlert(a);return `<tr class="click" data-a="apri" data-id="${a.id}"><td data-l="Affiliato"><b>${esc(nomeAff(a))}</b><div class="small muted">${esc(a.email)}</div></td><td data-l="Agenzia">${esc(a.nomeAgenzia)}</td>

function adScheda(a){
  if(!a)return '<div class="empty">Affiliato non trovato</div>';
  const acc=a.stato==='accettata';
  let h=`<button class="back" data-a="nav" data-v="affiliati">← Tutti gli affiliati</button>
  <div class="sch-h"><div><h2>${esc(nomeAff(a))}</h2><div class="muted">${esc(a.nomeAgenzia||'')}${urlDef(a)?` · <span class="mono">${esc(urlDef(a))}</span>`:''}</div></div>
    <div class="row">${statoBadge(a)}${a.stato==='in_attesa'?`<button class="btn danger" data-a="rifiuta" data-id="${a.id}">Rifiuta</button><button class="btn primary" data-a="accetta" data-id="${a.id}">Accetta</button>`:''}
    ${a.stato==='rifiutata'?`<button class="btn" data-a="accetta" data-id="${a.id}">Accetta comunque</button>`:''}</div></div>`;
  if(a.stato==='rifiutata')h+=`<div class="note bad"><b>Motivo del rifiuto:</b> ${esc(a.nota)}</div>`;
  if(a.stato==='bozza')h+=`<div class="note info">L'affiliato si è registrato ma non ha ancora inviato i dati.</div>`;
  h+=`<div class="sch-grid"><div class="card"><h3 style="margin-bottom:12px">Scheda affiliato</h3>${datiKV(a)}<dl class="kv" style="margin-top:7px"><dt>Registrato il</dt><dd>${fd(a.createdAt)}</dd><dt>Richiesta inviata</dt><dd>${fd(a.submittedAt)}</dd><dt>Esito</dt><dd>${a.decidedAt?fd(a.decidedAt):'—'}</dd></dl></div>`;
  // URL
  h+=`<div class="card"><div class="card-h"><h3>Verifica URL</h3>${a.urlDefinitivo!=null?badge('Definitivo scelto','ok'):''}</div>
    ${a.urls.map((u,i)=>u.value?`<div class="urlrow ${a.urlDefinitivo===i?'def':''}"><span class="i">${i+1}</span><span class="mono">${esc(u.value)}</span>
      ${a.urlDefinitivo===i?badge('Scelto dall\'affiliato','ok'):a.urlDefinitivo!=null?'':`<div class="row" style="gap:4px"><button class="btn sm ${u.stato==='disponibile'?'primary':''}" data-a="urlStato" data-id="${a.id}" data-i="${i}" data-s="disponibile">Disponibile</button><button class="btn sm ${u.stato==='non_disponibile'?'danger solid':''}" data-a="urlStato" data-id="${a.id}" data-i="${i}" data-s="non_disponibile">Non disp.</button></div>`}</div>`:'').join('')}
    ${a.urlDefinitivo==null?'<p class="small muted">Segna la disponibilità: l\'affiliato potrà scegliere solo tra quelli disponibili.</p>':''}</div>`;
  // Loghi
  if(acc)h+=`<div class="card full"><div class="card-h"><h3>Box logo – 3 proposte</h3>${a.logoScelto!=null?badge('L\'affiliato ha scelto la proposta '+(a.logoScelto+1),'accent'):badge('In attesa di scelta','neutral')}</div>
    <div class="logos">${a.loghi.map((l,i)=>`<div class="logo-slot ${a.logoScelto===i?'chosen':''}"><div class="row between"><b class="small">Proposta ${i+1}</b>${a.logoScelto===i?badge('★ Scelto','accent'):''}</div>
      <div class="img">${l?`<img src="${l}" alt="">`:'<span class="small muted">Nessun file</span>'}</div>
      <div class="row"><label class="btn sm" style="cursor:pointer">${l?'Sostituisci':'Carica logo'}<input type="file" accept="image/*" data-file="logo" data-id="${a.id}" data-i="${i}" style="display:none"></label>${l?`<button class="btn sm ghost" data-a="rmLogo" data-id="${a.id}" data-i="${i}">Rimuovi</button>`:''}</div></div>`).join('')}</div></div>`;

function genPw(){const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let p='';const r=new Uint32Array(10);crypto.getRandomValues(r);r.forEach(x=>p+=c[x%c.length]);return p.slice(0,4)+'-'+p.slice(4);}

function showFile(f){let body;if(/^image\//.test(f.type))body=`<img src="${f.data}" style="max-width:100%;border-radius:8px;border:1px solid var(--line)">`;
  else{let u=f.data;try{const b=atob(f.data.split(',')[1]);const arr=new Uint8Array(b.length);for(let i=0;i<b.length;i++)arr[i]=b.charCodeAt(i);u=URL.createObjectURL(new Blob([arr],{type:'application/pdf'}));}catch(e){}
  body=`<iframe src="${u}" style="width:100%;height:65vh;border:1px solid var(--line);border-radius:8px"></iframe><p class="small muted">Se l'anteprima non compare, il browser non consente di mostrare il PDF qui: il file è comunque salvato.</p>`;}
  modal({title:esc(f.name),body,wide:true,cancel:'Chiudi'});}

function collectProfilo(form,a){
  const f=new FormData(form);a.tipo=f.get('tipo')||a.tipo;
  if(form.querySelector('[name^="nome_"]')){const n=form.querySelectorAll('[name^="nome_"]').length;a.persone=[];for(let i=0;i<n;i++)a.persone.push({nome:(f.get('nome_'+i)||'').trim(),cognome:(f.get('cognome_'+i)||'').trim()});}
  if(form.querySelector('[name="azienda"]')){a.azienda=(f.get('azienda')||'').trim();a.piva=(f.get('piva')||'').trim();a.referente=(f.get('referente')||'').trim();}
  a.nomeAgenzia=(f.get('nomeAgenzia')||'').trim();a.telefono=(f.get('telefono')||'').trim();a.citta=(f.get('citta')||'').trim();
  a.urls=[0,1,2].map(i=>{const v=cleanUrl(f.get('url'+i));return v===a.urls[i].value?a.urls[i]:{value:v,stato:'da_verificare'};});
}

function readURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
async function imgData(file,max,type,q){const src=await readURL(file);if(file.type==='image/svg+xml')return src;
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
  const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);}x.drawImage(img,0,0,c.width,c.height);return c.toDataURL(type,q);}
